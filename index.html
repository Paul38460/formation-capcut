<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CapCut Academy — Formation Monteur Pro</title>
<style>
:root{--bg:#0a0c11;--bg2:#0f121a;--panel:#131722;--panel2:#1a1f2c;--line:#242b3a;--text:#eef0f6;--muted:#8c94a8;--accent:#2de2c0;--accent2:#5b8cff;--ink:#03201a;--amber:#ffb84d;--danger:#ff6b7d;--shadow:0 8px 30px rgba(0,0,0,.3);--r:14px;color-scheme:dark}
:root[data-theme="light"]{--bg:#f4f6fa;--bg2:#eceff5;--panel:#fff;--panel2:#f1f3f8;--line:#e0e4ec;--text:#10131b;--muted:#5a6275;--accent:#0a8f77;--accent2:#3a64d8;--ink:#fff;--amber:#b86e00;--danger:#d23a50;--shadow:0 8px 24px rgba(20,30,60,.08);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font:15px/1.65 "Inter","Segoe UI",-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);background-image:radial-gradient(900px 400px at 85% -10%,rgba(91,140,255,.10),transparent 60%),radial-gradient(700px 360px at 0 0,rgba(45,226,192,.07),transparent 60%);background-attachment:fixed}
.top{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));position:relative;box-shadow:0 4px 16px rgba(45,226,192,.3)}
.logo::after{content:"";position:absolute;inset:9px 8px 9px 12px;background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.top-progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);min-width:180px}
.progress-bar{flex:1;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:16px}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.menu{display:none}
.app{display:flex;align-items:flex-start;min-height:calc(100vh - 60px)}
.rail{width:300px;flex:none;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:18px 14px 40px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 60%,transparent)}
.nav-title{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:20px 10px 8px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:background .15s}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.nav-item .num{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.nav-item.active .num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);border-color:transparent}
.nav-item.done .num{background:var(--accent);color:var(--ink);border-color:transparent}
.nav-item .ttl{flex:1;font-size:13.5px;font-weight:600;line-height:1.3}
.nav-item .ttl small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
.nav-item.locked .ttl{opacity:.55}
.soon{font-style:normal;font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
main{flex:1;min-width:0;padding:40px clamp(20px,5vw,64px) 80px;max-width:1000px}
.kicker{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 12px;border-radius:99px;margin-bottom:14px}
h1.page-title{font-size:clamp(28px,4.2vw,42px);line-height:1.12;letter-spacing:-.025em;margin:0 0 14px;font-weight:800}
.lede{font-size:17px;color:var(--muted);max-width:68ch;margin:0 0 18px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.chip{font-size:12px;padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
section.block{margin:0 0 38px}
section.block h2{font-size:22px;letter-spacing:-.015em;margin:0 0 14px;padding:0;border:0;display:flex;align-items:center;gap:12px}
section.block h2::before{content:"";width:4px;height:22px;border-radius:4px;background:linear-gradient(var(--accent),var(--accent2))}
section.block h3{font-size:15.5px;margin:22px 0 8px}
p{margin:0 0 12px}
ul,ol{padding-left:22px;margin:0 0 14px}
li{margin-bottom:6px}
li::marker{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin:18px 0;box-shadow:var(--shadow)}
.card-title{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.card-title::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 20%,transparent)}
.card.tip{border-left:3px solid var(--amber)}
.card.tip .card-title{color:var(--amber)}
.card.warn{border-left:3px solid var(--danger)}
.card.warn .card-title{color:var(--danger)}
.exercise{margin:22px 0;padding:18px 22px;border-radius:var(--r);border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,transparent),color-mix(in srgb,var(--accent2) 7%,transparent))}
.exercise .card-title{color:var(--accent)}
kbd{display:inline-block;min-width:24px;text-align:center;padding:2px 8px;border-radius:7px;font:600 12px ui-monospace,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;color:var(--text)}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);margin:16px 0;font-size:13.5px}
th{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:11px 14px}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.quiz-q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.quiz-opts label{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;margin:8px 0;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--bg2);transition:.15s}
.quiz-opts label:hover{border-color:var(--accent)}
.quiz-opts label:has(input:checked){border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,transparent)}
.quiz-opts input{accent-color:var(--accent);margin-top:4px}
.quiz-opts label.correct{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.quiz-opts label.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.quiz-result{display:none;margin-top:8px;font-size:13.5px;color:var(--muted);padding:10px 14px;border-radius:10px;background:var(--panel2)}
.score{margin-top:14px;padding:14px 18px;border-radius:var(--r);font-weight:700;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent2) 14%,transparent))}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);border:0;border-radius:11px;padding:11px 20px;font:700 14px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.actions{margin:40px 0 18px;padding-top:24px;border-top:1px solid var(--line)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pager a{display:block;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;font-weight:600}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.pager .next{text-align:right}
.hero{padding:38px;border-radius:22px;border:1px solid var(--line);margin-bottom:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--panel)),color-mix(in srgb,var(--accent2) 13%,var(--panel)))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:30px}
.stat{padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.18s;position:relative}
.mcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.mcard .n{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.mcard h3{margin:6px 0 4px;font-size:16px}
.mcard p{font-size:13px;color:var(--muted);margin:0}
.mcard.locked{opacity:.55}
.mcard .st{position:absolute;top:16px;right:16px;font-size:11px;color:var(--muted)}
.mcard.done .st{color:var(--accent)}
.glossary dt{font-weight:700;margin-top:14px}
.glossary dd{margin:3px 0 0;color:var(--muted)}
.coming{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
footer.note{margin-top:40px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.scrim{display:none}
@media(max-width:900px){.icon-btn.menu{display:block}.rail{position:fixed;left:0;top:60px;z-index:60;transform:translateX(-102%);transition:.25s;background:var(--bg2);width:min(320px,86vw)}body.menu-open .rail{transform:none}body.menu-open .scrim{display:block;position:fixed;inset:60px 0 0;background:rgba(0,0,0,.5);z-index:55}.top-progress{min-width:100px}.brand span{display:none}.pager{grid-template-columns:1fr}.hero{padding:24px}}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;cursor:pointer}.checklist input{accent-color:var(--accent);margin-top:5px}
main{counter-reset:sec}
section.block h2{counter-increment:sec;scroll-margin-top:80px}
section.block h2::before{content:counter(sec,decimal-leading-zero);width:auto;height:auto;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--accent);padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
main p,main li{max-width:76ch}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.toc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-12px 0 32px}
.toc b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.toc a{font-size:12.5px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 18px;margin:10px 0}
summary{cursor:pointer;padding:14px 0;font-weight:600}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details p{color:var(--muted)}
.search{width:100%;padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;font-size:13.5px;margin:0 0 12px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.fiches{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.fiche{padding:18px 20px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.fiche h3{margin:2px 0 6px;font-size:16px}
.fiche p{font-size:13.5px;color:var(--muted)}
.fiche .mod{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.fiche dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:10px;font-weight:700}
.fiche dd{margin:2px 0 0;font-size:13.5px}
#readbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:70;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#toTop{display:none;position:fixed;right:20px;bottom:20px;z-index:45;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
@media print{:root{--bg:#fff;--panel:#fff;--panel2:#f3f3f3;--line:#ccc;--text:#000;--muted:#444}.top,.rail,.actions,.toc,#readbar,#toTop,.scrim,.search,.btn{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card,.fiche,details{box-shadow:none;break-inside:avoid}}
main{position:relative;animation:pe .45s ease both}
@keyframes pe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main::before{content:attr(data-num);position:absolute;top:-6px;right:clamp(10px,4vw,50px);font-size:clamp(90px,16vw,190px);font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--text);opacity:.045;pointer-events:none}
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.rv.in{opacity:1;transform:none}
.hero{background-size:220% 220%;animation:hg 16s ease infinite}
@keyframes hg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.fig{margin:0 0 36px;padding:20px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:var(--shadow)}
.fig svg{width:100%;height:auto;display:block}
.fig text{fill:var(--text);font:600 12.5px Inter,"Segoe UI",Arial,sans-serif}
.fig text.mu{fill:var(--muted);font-weight:500}
.fig text.wt{fill:#fff;font-size:14px}
.fig figcaption{margin-top:12px;font-size:12.5px;color:var(--muted);text-align:center}
.fig .a{fill:var(--accent)}.fig .b{fill:var(--accent2)}.fig .p{fill:var(--panel2);stroke:var(--line)}.fig .mu-f{fill:var(--muted);opacity:.5}
.shot{display:block;max-width:100%;margin:16px auto 0;border-radius:12px;border:1px solid var(--line)}
.zn rect{fill:var(--panel2);stroke:var(--line);animation:zp 8s infinite}
@keyframes zp{0%,22%{fill:var(--accent);fill-opacity:.4}28%,100%{fill:var(--panel2);fill-opacity:1}}
.kc rect{fill:var(--panel2);stroke:var(--line);stroke-width:2}
.kb{animation:kp 5s infinite}
@keyframes kp{0%,44%{fill:var(--panel2)}48%,56%{fill:var(--accent)}60%,100%{fill:var(--panel2)}}
.ph{animation:phm 5s infinite}
@keyframes phm{0%{transform:translateX(-198px)}45%,100%{transform:translateX(0)}}
.cutr{animation:cr 5s infinite}
@keyframes cr{0%,48%{transform:translateX(0)}56%,92%{transform:translateX(20px)}100%{transform:translateX(0)}}
.gr{transform-box:fill-box;transform-origin:left;animation:gw2 1.2s both}
@keyframes gw2{from{transform:scaleX(0)}}
.lane,.mrow{display:flex;align-items:center;gap:14px;margin:12px 0}
.lane span,.mrow span{width:150px;flex:none;font-size:13px;color:var(--muted)}
.trk{flex:1;height:26px;border-radius:99px;background:var(--panel2);position:relative}
.trk i{position:absolute;top:5px;left:0;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:mv 2.6s infinite alternate}
@keyframes mv{to{left:calc(100% - 16px)}}
.mt{flex:1;height:16px;border-radius:99px;background:var(--panel2);overflow:hidden}
.mt.tall{height:24px}
.mt b{display:block;height:100%;width:100%;transform-origin:left;border-radius:99px}
.mrow small{font-size:12px;color:var(--muted);min-width:150px}
@keyframes vo{0%,15%{transform:scaleX(.08)}25%,60%{transform:scaleX(.9)}70%,100%{transform:scaleX(.08)}}
@keyframes mu2{0%,15%{transform:scaleX(.75)}25%,60%{transform:scaleX(.25)}70%,100%{transform:scaleX(.75)}}
@keyframes sf{0%,23%,35%,100%{transform:scaleX(.04)}27%{transform:scaleX(.55)}}
.bar{transform-origin:left;animation:gw2 1.6s both}
.wd{opacity:0;animation:pop 4.5s infinite}
.wd.hl{fill:var(--accent);font-size:20px}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}8%,80%{opacity:1;transform:none}92%,100%{opacity:0}}
.crv{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 4s ease infinite}
@keyframes dr{0%{stroke-dashoffset:1}60%,100%{stroke-dashoffset:0}}
.sz{fill:var(--danger);animation:pl 2.4s infinite alternate}
@keyframes pl{from{opacity:.15}to{opacity:.5}}
.cmp{position:relative;border-radius:14px;overflow:hidden;max-width:560px;margin:0 auto}
.cmp .lay{display:block}.cmp .lay+.lay{position:absolute;inset:0}
.cmp svg{width:100%;height:auto;display:block}
.graded{filter:contrast(1.25) saturate(1.35) sepia(.25) hue-rotate(-12deg);clip-path:inset(0 50% 0 0)}
.tg{position:absolute;top:10px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700}
.tg.l{right:10px}.tg.r{left:10px}
.rng{display:block;width:min(560px,100%);margin:14px auto 0;accent-color:var(--accent)}
textarea.notes{width:100%;min-height:120px;resize:vertical;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px}
textarea.notes:focus{outline:2px solid var(--accent);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media print{.rv{opacity:1!important;transform:none!important}main::before{display:none}}
@media(max-width:640px){.lane span,.mrow span{width:96px}.mrow small{display:none}}
html[data-mode="pro"]{--accent:#b794ff;--accent2:#ff7ab8;--ink:#1a0b33}
html[data-mode="pro"][data-theme="light"]{--accent:#6d2fe0;--accent2:#d6336c;--ink:#fff}
html[data-mode="pro"] body{background-image:radial-gradient(900px 400px at 85% -10%,rgba(255,122,184,.10),transparent 60%),radial-gradient(700px 360px at 0 0,rgba(183,148,255,.10),transparent 60%)}
.mode-pill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:7px 14px;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer}
html[data-mode="pro"] .mode-pill{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);border:0}
.pro-i{display:none}
html[data-mode="pro"] .pro-i{display:inline-block}
body.focus .rail{display:none}
body.focus main{margin:0 auto}
.badge{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 9px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink)}
#gate{position:fixed;inset:0;z-index:200;display:none;overflow:auto;padding:30px 18px;background:radial-gradient(900px 500px at 80% -10%,rgba(91,140,255,.18),transparent 60%),radial-gradient(800px 500px at 0 100%,rgba(183,148,255,.16),transparent 60%),var(--bg)}
#gate.show{display:grid;place-items:center}
.gwrap{max-width:900px;width:100%;text-align:center;animation:pe .5s ease both}
.logo.big{width:56px;height:56px;border-radius:16px;margin:0 auto 14px}
.gwrap h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.025em;margin:0 0 8px}
.gl{color:var(--muted);margin:0 auto 28px;max-width:52ch}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;text-align:left}

  {id:"shortcuts", num:"★", title:"Bibliothèque de raccourcis", sub:"Référence complète", ready:true},
];

let done = {};
try{ done = JSON.parse(localStorage.getItem('cc_academy_done')||'{}'); }catch(e){ done = {}; }
function saveDone(){ try{ localStorage.setItem('cc_academy_done', JSON.stringify(done)); }catch(e){} }
function markDone(id){ done[id]=true; saveDone(); renderNav(); updateProgress(); }

function updateProgress(){
  const total = MODULES.filter(m=>m.id.startsWith('m')).length;
  const got = MODULES.filter(m=>m.id.startsWith('m') && done[m.id]).length;
  const pct = total? Math.round(got/total*100):0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = pct+' % du programme terminé ('+got+'/'+total+' modules)';
}

let current = location.hash.replace('#','') || 'home';

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = MODULES.map(m=>{
    const cls = ['nav-item'];
    if(m.id===current) cls.push('active');
    if(done[m.id]) cls.push('done');
    if(!m.ready) cls.push('locked');
    return `<div class="${cls.join(' ')}" data-id="${m.id}" onclick="go('${m.id}')">
      <div class="num">${done[m.id]?'✓':m.num}</div>
      <div class="ttl">${m.title}<span class="sub">${m.sub}</span></div>
    </div>`;
  }).join('');
}

function go(id){
  current = id;
  location.hash = id;
  renderNav();
  renderMain();
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', ()=>{ current = location.hash.replace('#','')||'home'; renderNav(); renderMain(); });

function renderMain(){
  const main = document.getElementById('main');
  const mod = MODULES.find(m=>m.id===current) || MODULES[0];
  if(!mod.ready){
    main.innerHTML = `<div class="kicker">MODULE ${mod.num}</div><h1 class="page-title">${mod.title}</h1>
    <p class="lede">${mod.sub}</p>
    <div class="coming">Ce module fait partie du programme complet mais n'a pas encore été rédigé dans cette première version. Dis-moi lequel développer en priorité et je l'ajoute avec le même niveau de détail que les modules 1 à 3.</div>`;
    return;
  }
  main.innerHTML = CONTENT[mod.id] ? CONTENT[mod.id]() : '<p>Contenu indisponible.</p>';
  if(mod.id.startsWith('m')){
    const btnWrap = document.createElement('div');
    btnWrap.innerHTML = `<button class="btn" onclick="markDone('${mod.id}')">Marquer comme terminé</button>`;
    main.appendChild(btnWrap);
  }
}

<p class="lede">Comprendre chaque zone de l'espace de travail avant de monter évite 80 % des erreurs de débutant. On pose ici les fondations.</p>

<section class="block">
<h2>1. Les quatre zones de l'interface</h2>
<p>CapCut Desktop est organisé en quatre zones fixes, et comprendre leur rôle respectif est la base de tout workflow efficace :</p>
<ul>
<li><b>Le panneau Médias</b> (en haut à gauche) : c'est votre bibliothèque de travail. On y importe les vidéos, photos, sons, textes, autocollants, effets, transitions, filtres et templates.</li>
<li><b>La fenêtre de prévisualisation</b> (en haut au centre/droite) : affiche le rendu en temps réel à la position du curseur sur la timeline. On y manipule aussi directement les calques (déplacement, rotation, redimensionnement).</li>
<li><b>Le panneau de réglages</b> (à droite) : contextuel, il change selon l'élément sélectionné (vidéo, texte, audio, effet). C'est ici que se trouvent 90 % des réglages fins.</li>
<li><b>La timeline</b> (en bas) : le cœur du montage. Chaque piste représente une couche, empilée de bas (arrière-plan) vers le haut (premier plan).</li>

<div class="kicker">MODULE 03</div>
<h1 class="page-title">Montage de base : couper, organiser, structurer</h1>
<p class="lede">Avant les effets, la base de tout montage réussi est une structure de coupe propre. C'est 70 % du travail d'un monteur professionnel, même si c'est la partie la moins visible.</p>

<section class="block">
<h2>1. Split, Trim et Ripple : bien distinguer les trois</h2>
<ul>
<li><b>Split (couper)</b> : <kbd>Ctrl</kbd>+<kbd>B</kbd>. Divise un clip en deux sans rien supprimer. Utilisé pour isoler un passage à traiter séparément (effet, vitesse, suppression).</li>
<li><b>Trim (ajuster les bords)</b> : on fait glisser le bord gauche ou droit d'un clip directement sur la timeline pour raccourcir ou allonger son point d'entrée/sortie, sans déplacer les autres clips.</li>
<li><b>Ripple delete (suppression avec fermeture)</b> : supprime un segment ET referme automatiquement le vide créé, en décalant tous les clips suivants vers la gauche. Indispensable pour ne jamais laisser de trous noirs.</li>
</ul>
<div class="card warn"><div class="card-title">Erreur fréquente</div>Supprimer un clip avec la touche <kbd>Suppr</kbd> simple laisse souvent un espace vide sur la piste (selon le mode actif). Vérifiez toujours visuellement qu'aucun "trou" n'apparaît avant de passer au clip suivant.</div>

<p>Convention de montage recommandée, de bas en haut :</p>

<tr><td>2</td><td>Inserts / B-roll</td></tr>

<tr><td>Audio 2</td><td>Musique</td></tr>

<p>Cette hiérarchie fixe évite de chercher un élément pendant 10 minutes sur un projet complexe, et facilite énormément la relecture par un client ou un collègue.</p>

<p class="lede">Une transition doit toujours servir le rythme ou le sens, jamais être un gadget. Un monteur pro en utilise peu, mais choisies avec précision.</p>

<section class="block">
<h2>1. Les trois familles de transitions</h2>
<ul>
<li><b>Transitions natives CapCut</b> (fondu, glissement, zoom, cube...) : accessibles en double-cliquant sur l'icône entre deux clips sur la timeline. Rapides mais reconnaissables — à utiliser avec parcimonie sur du contenu professionnel.</li>
<li><b>Transitions par le mouvement (match cut)</b> : on aligne un mouvement ou une forme entre le plan A et le plan B (ex. un geste qui se poursuit). Aucune transition logicielle n'est appliquée : c'est le montage lui-même qui crée l'illusion de continuité.</li>
<li><b>Transitions personnalisées par masque/keyframes</b> : combinaison d'un masque animé (module 06) et d'une courbe de vitesse pour créer une transition unique à l'identité visuelle du projet.</li>
</ul>
<div class="card tip"><div class="card-title">Astuce pro</div>Le fondu au noir (fade to black) reste la transition la plus utilisée en production professionnelle : elle signale une rupture temporelle ou de lieu sans détourner l'attention du contenu.</div>
</section>

<section class="block">
<h2>2. Manipulation exacte d'une transition native</h2>
<ol>
<li>Placez deux clips bout à bout sur la même piste.</li>
<li>Double-cliquez sur l'icône carrée blanche entre les deux clips.</li>
<li>Choisissez la catégorie (Fondu, Déplacement, Simple, Spécial, Décor...) et ajustez la durée (0,2 à 1 s recommandé pour un rendu discret).</li>
</ol>
<div class="card warn"><div class="card-title">Erreur fréquente</div>Appliquer une transition "flashy" (zoom rotatif, glitch) toutes les 3 coupes rend le montage amateur. Réservez les transitions marquées pour des ruptures de séquence volontaires.</div>
</section>

<section class="block">
<h2>3. Créer une transition personnalisée</h2>
<p>Exemple concret : transition "essuyage" directionnelle sans utiliser le preset natif.</p>

<li>Ajoutez un masque rectangulaire (module 06) sur le clip B, positionné hors cadre à gauche.</li>
<li>Posez une image clé de position hors cadre à l'instant T, puis une seconde image clé en position centrée à T+0,4s.</li>

m4: ()=>`
<div class="kicker">MODULE 05</div>
<h1 class="page-title">Images clés & animations (keyframes)</h1>
<p class="lede">Les keyframes sont le langage universel de l'animation dans tout logiciel de montage. Les maîtriser ouvre toutes les portes : habillages, recadrages dynamiques, effets de zoom, transitions personnalisées.</p>

<section class="block">
<h2>1. Principe de fonctionnement</h2>
<p>Une image clé (keyframe) fixe la valeur d'un paramètre (position, échelle, rotation, opacité...) à un instant précis. Entre deux keyframes, CapCut <b>interpole</b> automatiquement la valeur : c'est cette interpolation qui crée le mouvement.</p>
<h3>Manipulation exacte</h3>
<ol>
<li>Sélectionnez le clip ou calque à animer.</li>
<li>Dans le panneau de réglages, repérez l'icône losange à côté du paramètre (Position, Échelle, Rotation, Opacité).</li>
<li>Placez le curseur de lecture à l'instant de départ → cliquez sur le losange pour créer la première keyframe.</li>
<li>Déplacez le curseur à l'instant d'arrivée → modifiez la valeur : une seconde keyframe est créée automatiquement.</li>
</ol>
</section>

<section class="block">
<h2>2. Les courbes de vitesse : la différence entre amateur et pro</h2>
<p>Une interpolation linéaire par défaut donne un mouvement mécanique et peu naturel. Clic droit sur une keyframe → courbe d'accélération :</p>
<ul>
<li><b>Ease-in</b> : démarrage lent, accélération progressive — utile pour une sortie de cadre.</li>
<li><b>Ease-out</b> : démarrage rapide, ralentissement en fin de mouvement — utile pour une arrivée d'élément à l'écran.</li>
<li><b>Ease-in-out</b> : le plus naturel pour un mouvement qui démarre et se termine à l'écran (ex. un titre qui apparaît puis se stabilise).</li>
</ul>
<div class="card tip"><div class="card-title">Astuce pro</div>Pour un zoom "respiration" discret sur une interview (effet Ken Burns), animez l'échelle de 100% à 106% sur toute la durée du plan avec une courbe linéaire très lente : le mouvement doit être imperceptible consciemment mais garder l'image vivante.</div>
</section>

<section class="block">
<h2>3. Exemple concret : habillage de texte animé</h2>
<ol>
<li>Texte à l'opacité 0 et position décalée vers le bas à T.</li>
<li>Keyframe à T+0,3s : opacité 100%, position finale, courbe ease-out.</li>
<li>Le texte reste stable 2 secondes.</li>
<li>Keyframe de sortie : opacité 0 avant la coupe suivante, courbe ease-in.</li>
</ol>
<div class="card warn"><div class="card-title">Erreur fréquente</div>Oublier la keyframe de sortie laisse le texte figé jusqu'à la coupe suivante : visuellement, cela donne l'impression d'un bug plutôt que d'un choix de montage.</div>
<div class="exercise">
<div class="card-title">Exercice pratique</div>
Animez un logo en incrustation : entrée par le bas avec ease-out en 0,3s, maintien statique 2s, sortie vers la droite avec ease-in en 0,3s.
</div>
</section>
<section class="block"><h2>Quiz</h2><div id="quizAreaM4"></div></section>
<script>setTimeout(()=>renderQuizGeneric('quizAreaM4',[

    {t:"Il supprime automatiquement la première keyframe",ok:false}],exp:"L'interpolation entre deux keyframes est ce qui crée le mouvement animé."},

]),0);<\/script>

m5: ()=>`
<div class="kicker">MODULE 06</div>
<h1 class="page-title">Masques & incrustations : fond vert et compositing</h1>
<p class="lede">Le masquage permet d'isoler, combiner et superposer des images. C'est la base technique du fond vert, des transitions personnalisées et des effets de "picture in picture" professionnels.</p>

<section class="block">
<h2>1. Les types de masques disponibles</h2>
<ul>
<li><b>Masque de forme</b> (rectangle, cercle, étoile, cœur, linéaire) : cache une partie du calque selon une forme géométrique, animable en position/taille/rotation/flou de bordure.</li>
<li><b>Incrustation chroma key (fond vert/bleu)</b> : supprime une couleur spécifique du calque pour laisser transparaître le calque du dessous.</li>
</ul>
</section>

<section class="block">
<h2>2. Chroma key : manipulation exacte et réglages</h2>
<ol>
<li>Placez le clip tourné en fond vert sur la piste du dessus, et l'arrière-plan de remplacement sur la piste du dessous.</li>
<li>Sélectionnez le clip fond vert → panneau Réglages → onglet <i>Chroma Key / Keying</i>.</li>
<li>Utilisez la pipette pour échantillonner la couleur du fond (vert ou bleu).</li>
<li>Ajustez <i>Intensité</i> (force de suppression de la couleur) et <i>Tolérance / Ombre</i> (adoucissement des bords) progressivement, en zoomant sur les contours du sujet (cheveux notamment).</li>
</ol>
<table>
<thead><tr><th>Réglage</th><th>Effet si trop élevé</th><th>Effet si trop faible</th></tr></thead>
<tbody>
<tr><td>Intensité</td><td>Le sujet devient transparent par endroits (surtout cheveux/peau claire)</td><td>Des résidus verts restent visibles sur les bords</td></tr>
<tr><td>Tolérance</td><td>Contour flou et imprécis</td><td>Contour dentelé, artificiel</td></tr>
</tbody>
</table>
<div class="card warn"><div class="card-title">Erreur fréquente</div>Un fond vert mal éclairé (plis, ombres portées) rend le chroma key quasiment impossible à nettoyer en post-production, même avec les meilleurs réglages. 80% de la qualité d'un chroma key se joue au tournage, pas au montage.</div>
<div class="card tip"><div class="card-title">Astuce pro</div>Ajoutez un léger flou de bordure (1-2 px) et une désaturation discrète en bordure du sujet détouré : cela évite l'effet "autocollant" où le sujet semble plaqué sur le nouveau fond sans intégration lumineuse.</div>
</section>

<section class="block">
<h2>3. Masque de forme animé pour transition ou habillage</h2>
<p>Exemple concret : révéler un texte progressivement avec un masque linéaire.</p>
<ol>
<li>Appliquez un masque linéaire sur le calque de texte, positionné pour cacher tout le texte au départ.</li>
<li>Keyframe de position du masque à T (texte masqué) et à T+0,5s (texte totalement révélé), courbe ease-out.</li>
</ol>
<div class="exercise">
<div class="card-title">Exercice pratique</div>
Réalisez une incrustation chroma key complète : sujet sur fond vert + nouvel arrière-plan, avec un nettoyage de bordure propre (sans résidu vert visible en zoomant à 200%).
</div>
</section>
<section class="block"><h2>Quiz</h2><div id="quizAreaM5"></div></section>
<script>setTimeout(()=>renderQuizGeneric('quizAreaM5',[
  {q:"Quelle est la cause la plus fréquente d'un chroma key raté ?",opts:[
    {t:"Un mauvais réglage d'intensité uniquement",ok:false},
    {t:"Un fond vert mal éclairé au tournage",ok:true},
    {t:"L'utilisation d'un fond bleu plutôt que vert",ok:false}],exp:"Un éclairage inégal du fond vert au tournage rend le nettoyage en post-production très difficile, quels que soient les réglages appliqués ensuite."},
  {q:"À quoi sert le réglage 'Tolérance / Ombre' en chroma key ?",opts:[
    {t:"À adoucir et affiner le contour du détourage",ok:true},
    {t:"À changer la couleur du fond de remplacement",ok:false},
    {t:"À accélérer l'export",ok:false}],exp:"La tolérance adoucit les bords du détourage ; mal réglée, elle rend le contour flou ou au contraire dentelé."}
]),0);<\/script>
`,

<div class="kicker">MODULE 07</div>
<h1 class="page-title">Colorimétrie & rendu cinématographique</h1>
<p class="lede">La couleur est ce qui fait qu'une vidéo « sonne pro » avant même qu'on ait écouté le son. Le principe : corriger d'abord, étalonner ensuite.</p>
<section class="block">
<h2>1. Corriger avant d'étalonner</h2>
<p><b>Correction</b> = rendre l'image neutre et cohérente (exposition, blancs, contraste). <b>Étalonnage</b> = donner un style (chaud, froid, ciné). Inverser l'ordre donne des couleurs fausses impossibles à rattraper.</p>
<h3>Manipulation exacte</h3>
<p>Sélectionne le clip → panneau Réglages → onglet <i>Ajuster</i> (ou <i>Basique</i> selon la version). Les curseurs se travaillent de haut en bas :</p>
<table>
<thead><tr><th>Réglage</th><th>Rôle</th><th>Piège</th></tr></thead>
<tbody>
<tr><td>Température / Teinte</td><td>Équilibre des blancs (bleuté ↔ orangé, vert ↔ magenta)</td><td>Régler sur un mur coloré au lieu d'un blanc ou gris neutre</td></tr>
<tr><td>Exposition</td><td>Luminosité globale</td><td>Brûler les hautes lumières (ciel blanc sans détail)</td></tr>
<tr><td>Contraste</td><td>Écart clair/sombre</td><td>Trop de contraste écrase les ombres</td></tr>
<tr><td>Surbrillances / Ombres</td><td>Récupérer le détail des zones claires ou sombres</td><td>Image « plate » si tout est remonté</td></tr>
<tr><td>Saturation</td><td>Intensité des couleurs</td><td>Peaux oranges fluo au-delà de +15 environ</td></tr>
</tbody>
</table>
<div class="card warn"><div class="card-title">Erreur fréquente</div>Monter la saturation pour « faire vivant ». Une image pro est souvent <i>moins</i> saturée qu'un rendu brut de téléphone ; c'est le contraste de teintes qui donne l'impact.</div>
</section>
<section class="block">
<h2>2. Construire un look cinéma</h2>
<ul>
<li><b>Teal &amp; orange</b> : ombres tirées vers le bleu-vert, peaux et lumières vers l'orangé (via les courbes/roues de couleurs si ta version les propose, sinon via température + teinte).</li>
<li><b>Contraste doux</b> en S, ombres légèrement relevées plutôt que noir total.</li>
<li><b>Finitions discrètes</b> : léger grain, vignettage très faible, bandes noires 2,35:1 (deux rectangles noirs ou un effet de bandes).</li>
<li><b>LUT</b> : importable dans les réglages d'ajustement (selon la version). Règle d'or : réduire son intensité à 30-60 %, une LUT à 100 % est rarement juste sur tes images.</li>
</ul>
<div class="card tip"><div class="card-title">Astuce pro</div>Place ton étalonnage sur un <b>calque d'ajustement</b> (panneau Ajustements) étiré sur toute la séquence : un seul réglage pour tous les plans, donc un rendu parfaitement cohérent. Corrige ensuite plan par plan en dessous.</div>
<div class="exercise"><div class="card-title">Exercice pratique</div>Prends 3 plans tournés à des heures différentes. Corrige-les pour qu'ils semblent appartenir à la même scène, puis applique un look unique via un calque d'ajustement. Compare avant/après en coupant l'effet.</div>

m7: ()=>`
<div class="kicker">MODULE 08</div>
<h1 class="page-title">Sound design & mixage audio</h1>
<p class="lede">Un spectateur pardonne une image moyenne, jamais un son mauvais. Le mixage consiste à donner à chaque élément sa place, avec la voix en priorité.</p>
<section class="block">
<h2>1. Hiérarchie des niveaux</h2>
<table>
<thead><tr><th>Élément</th><th>Niveau repère</th><th>Rôle</th></tr></thead>
<tbody>
<tr><td>Voix</td><td>Autour de 0 dB, crêtes sous le rouge</td><td>Message principal</td></tr>
<tr><td>Musique sous la voix</td><td>Environ 15 à 25 dB plus bas</td><td>Émotion, rythme</td></tr>
<tr><td>Musique sans voix</td><td>Remontée progressive</td><td>Respiration, transitions</td></tr>
<tr><td>SFX</td><td>Environ 6 à 12 dB sous la voix</td><td>Accents, mouvement</td></tr>
</tbody>
</table>
<p>Ce sont des repères de départ : l'oreille décide. Vérifie toujours au casque ET sur le haut-parleur du téléphone.</p>
<div class="card warn"><div class="card-title">Erreur fréquente</div>Laisser le vumètre atteindre le rouge : le son sature (clipping) et aucune retouche ne le répare. Baisse le volume du clip, ne compense pas à l'export.</div>
</section>
<section class="block">
<h2>2. Nettoyer et équilibrer la voix</h2>
<ol>
<li>Sélectionne le clip voix → Réglages → <i>Audio</i> → <i>Basique</i>.</li>
<li>Active la réduction de bruit et/ou l'amélioration de la voix si ta version les propose (certaines options peuvent être marquées Pro).</li>
<li>Normalise le volume pour que toutes les prises soient au même niveau.</li>
<li>Ajoute fondu entrant/sortant (poignées en bord de clip) pour éviter les claquements aux coupes.</li>
</ol>
<h3>Ducking : baisser la musique quand on parle</h3>
<p>Si ta version propose un ducking automatique, active-le sur la musique. Sinon, méthode manuelle fiable : 4 images clés de volume sur la musique (haut → bas juste avant la voix, bas → haut juste après), avec une transition de 0,3 s.</p>
</section>
<section class="block">
<h2>3. SFX et technique J-cut / L-cut</h2>
<ul>
<li><b>Trois couches de SFX</b> : ambiance (fond continu), accents (whoosh, impact), détails (pas, clics).</li>
<li><b>Room tone</b> : comble les silences secs avec une ambiance discrète au lieu d'un vide numérique.</li>
<li><b>J-cut / L-cut</b> : clic droit sur le clip → séparer l'audio, puis décale l'audio pour qu'il commence avant (J) ou finisse après (L) l'image : les enchaînements paraissent fluides.</li>
</ul>
<div class="exercise"><div class="card-title">Exercice pratique</div>Mixe une scène de 20 s avec voix + musique + 3 SFX. La voix doit rester parfaitement intelligible sur le haut-parleur du téléphone, sans que la musique disparaisse.</div>
</section>

<p class="lede">Une majorité de vidéos courtes sont regardées sans le son. Le texte n'est pas décoratif : c'est un second canal de narration.</p>

m9: ()=>`
<div class="kicker">MODULE 10</div>
<h1 class="page-title">Montage dynamique & techniques virales</h1>
<p class="lede">Un montage viral n'est pas « plein d'effets » : c'est un rythme maîtrisé où l'œil et l'oreille reçoivent une nouveauté toutes les 2 à 4 secondes.</p>
<section class="block">
<h2>1. La boîte à outils du rythme</h2>
<ul>
<li><b>Jump cuts</b> : supprime silences, respirations et hésitations en coupant directement dans le plan.</li>
<li><b>Punch-in</b> : alterne deux cadrages d'un même plan (100 % puis environ 110-120 % d'échelle via image clé ou simple changement d'échelle) pour simuler deux caméras.</li>
<li><b>Synchro sur la musique</b> : pose des marqueurs sur les temps forts (marqueur manuel, ou détection automatique des rythmes si ta version la propose) et cale tes coupes dessus.</li>
<li><b>Rampe de vitesse (speed ramp)</b> : panneau Vitesse → <i>Courbe</i> : ralentir sur l'action clé, accélérer avant/après. Des préréglages existent, personnalise les points si besoin.</li>
<li><b>Image figée</b> : freeze frame pour appuyer un moment, souvent avec texte ou SFX.</li>
</ul>
<div class="card tip"><div class="card-title">Astuce pro</div>Chaque coupe visuelle doit avoir un équivalent sonore (whoosh, impact, changement de musique). Image et son qui bougent ensemble donnent la sensation de rythme.</div>
</section>
<section class="block">
<h2>2. Le principe du « pattern interrupt »</h2>
<p>Pour garder l'attention, change quelque chose toutes les 3 à 5 secondes : cadrage, B-roll, texte, effet sonore, angle. Pas besoin de tout changer à chaque fois, un seul élément suffit.</p>
<table>
<thead><tr><th>Technique</th><th>Fréquence conseillée</th><th>Risque si abusé</th></tr></thead>

</tbody>

<div class="card warn"><div class="card-title">Erreur fréquente</div>Empiler les effets pour masquer un contenu faible. Un rythme rapide ne sauve pas un propos vide : le contenu passe d'abord.</div>

<h1 class="page-title">Storytelling & rétention de l'attention</h1>

<section class="block">
<h2>1. La structure d'une vidéo courte</h2>
<ol>
<li><b>Hook (0 à 3 s)</b> : la raison de rester. Pas d'introduction type « Salut, aujourd'hui je vais... ».</li>
<li><b>Promesse / contexte</b> : ce que le spectateur va obtenir.</li>
<li><b>Développement</b> : étapes avec tension croissante.</li>
<li><b>Payoff</b> : la révélation, le résultat.</li>
<li><b>Fin</b> : appel à l'action, ou boucle vers le début.</li>
</ol>
<h3>Quatre types de hook efficaces</h3>
<ul>
<li>Le <b>résultat d'abord</b> (montrer le final avant le processus).</li>
<li>La <b>question</b> qui touche un problème réel.</li>
<li>L'<b>affirmation inattendue</b> qui contredit une idée reçue.</li>
<li>L'<b>action immédiate</b> : commencer en plein mouvement.</li>
</ul>
<div class="card tip"><div class="card-title">Astuce pro</div>Les boucles ouvertes (« à la fin je te montre pourquoi... ») donnent une raison de regarder jusqu'au bout. Tiens-les : une promesse non tenue détruit la confiance.</div>

glossary: ()=>`
<div class="kicker">RÉFÉRENCE</div>
<h1 class="page-title">Lexique du monteur professionnel</h1>
<p class="lede">Le vocabulaire exact permet de communiquer sans ambiguïté avec un client, un réalisateur ou un autre monteur.</p>
<dl class="glossary">
<dt>A-roll</dt><dd>Le plan principal, généralement la personne qui parle à la caméra.</dd>
<dt>B-roll</dt><dd>Plans d'illustration / inserts utilisés pour couvrir une coupe ou enrichir visuellement le propos.</dd>
<dt>Ripple delete</dt><dd>Suppression d'un segment qui referme automatiquement le vide créé sur la piste.</dd>
<dt>Keyframe (image clé)</dt><dd>Point fixé dans le temps définissant une valeur (position, taille, opacité...) ; CapCut interpole entre deux keyframes.</dd>
<dt>J-cut / L-cut</dt><dd>Techniques où le son d'un plan démarre avant (J-cut) ou se termine après (L-cut) le changement d'image, pour fluidifier la transition.</dd>
<dt>Ducking</dt><dd>Baisse automatique du volume de la musique lorsque la voix est présente.</dd>
<dt>LUT</dt><dd>Table de correspondance de couleurs appliquée pour donner un rendu colorimétrique spécifique.</dd>
<dt>Jump cut</dt><dd>Coupe franche entre deux moments proches du même plan, souvent utilisée volontairement dans les formats courts dynamiques.</dd>
<dt>Chroma key</dt><dd>Technique d'incrustation sur fond vert ou bleu.</dd>
<dt>Rendu / export</dt><dd>Génération du fichier vidéo final à partir du projet monté.</dd>
<dt>Étalonnage</dt><dd>Travail de style de la couleur, réalisé après la correction qui neutralise l'image.</dd>
<dt>Calque d'ajustement</dt><dd>Couche qui applique un réglage de couleur à tout ce qui se trouve en dessous sur la timeline.</dd>
<dt>Speed ramp</dt><dd>Variation progressive de la vitesse d'un clip (accélération puis ralenti, ou l'inverse).</dd>
<dt>Punch-in</dt><dd>Zoom sur un plan pour simuler un changement de cadrage ou de caméra.</dd>
<dt>Hook</dt><dd>Accroche des premières secondes qui donne une raison de continuer à regarder.</dd>
<dt>Rétention</dt><dd>Part du public qui reste jusqu'à un moment donné de la vidéo.</dd>
<dt>Pattern interrupt</dt><dd>Changement volontaire (image, son, texte) pour relancer l'attention.</dd>
<dt>Room tone</dt><dd>Ambiance sonore d'un lieu, utilisée pour combler les silences.</dd>
<dt>Clipping</dt><dd>Saturation du son lorsque le niveau dépasse le maximum, irréparable après coup.</dd>
<dt>Débit (bitrate)</dt><dd>Quantité de données par seconde de vidéo ; plus il est élevé, plus l'image est fidèle et le fichier lourd.</dd>
<dt>Codec</dt><dd>Méthode de compression de la vidéo (H.264, HEVC...).</dd>
<dt>Zone de sécurité</dt><dd>Partie de l'image non recouverte par l'interface de la plateforme.</dd>
</dl>
<p style="color:var(--muted);font-size:13px;">Termes classés dans l'ordre d'apparition dans la formation.</p>

}
function checkQuiz(){
  const qs = window._quizData;

    const checked = document.querySelector('input[name="q'+i+'"]:checked');
    const labels = document.querySelectorAll('.quiz-q[data-qi="'+i+'"] .quiz-opts label');

CONTENT.fiches=()=>`<div class="kicker">RÉFÉRENCE</div><h1 class="page-title">Fiches techniques</h1><p class="lede">Douze fiches à garder sous la main pendant tes montages. Les noms de menus peuvent varier selon ta version de CapCut.</p><div class="meta"></div><input class="search" id="fsearch" placeholder="Rechercher une fiche (ex. masque, export, audio)…" oninput="filterFiches(this.value)"><div class="grid fiches" id="fgrid">${FICHES.map(f=>`<div class="fiche"><div class="mod">${f[1]}</div><h3>${f[0]}</h3><p>${f[2]}</p><dl><dt>Où / comment</dt><dd>${f[3]}</dd><dt>Réglages conseillés</dt><dd>${f[4]}</dd><dt>À éviter</dt><dd>${f[5]}</dd></dl></div>`).join('')}</div>`;
function filterFiches(v){v=v.toLowerCase();document.querySelectorAll('#fgrid .fiche').forEach(c=>{c.style.display=c.textContent.toLowerCase().includes(v)?'':'none';});}
MODULES.splice(MODULES.findIndex(m=>m.id==='glossary'),0,{id:"fiches",num:"▤",title:"Fiches techniques",sub:"12 fiches de référence rapide",ready:true});
function mkQ(a){return a.map(([q,o,c,e])=>({q:q,opts:o.map((t,i)=>({t:t,ok:i===c})).sort(()=>Math.random()-.5),exp:e}));}
function faqHtml(id){const f=FAQ[id];return f?`<section class="block"><h2>Dépannage : questions fréquentes</h2>${f.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</section>`:'';}
function buildToc(){
  const m=document.getElementById('main'),hs=[...m.querySelectorAll('section.block h2')],meta=m.querySelector('.meta');
  if(hs.length<3||!meta)return;
  hs.forEach((h,i)=>h.id='s'+i);
  const t=document.createElement('nav');t.className='toc';
  t.innerHTML='<b>Dans ce module</b>'+hs.map((h,i)=>`<a onclick="document.getElementById('s${i}').scrollIntoView({behavior:'smooth',block:'start'})">${h.textContent}</a>`).join('');
  meta.insertAdjacentElement('afterend',t);
}
const _rm3=renderMain;

};
function applyNavFilter(){

}

function reveal(){
  if(!('IntersectionObserver' in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06});
  document.querySelectorAll('#main section.block,#main .card,#main .exercise,#main .quiz-q,#main details,#main .fig,#main .fiche').forEach(e=>{e.classList.add('rv');io.observe(e);});
}

MODULES.splice(MODULES.findIndex(m=>m.id==='tp'),0,{id:"flash",num:"▣",title:"Cartes de révision",sub:"Répétition espacée · 24 cartes",ready:true,pro:true},{id:"proexam",num:"★",title:"Examen Pro",sub:"20 mises en situation · 25 min",ready:true,pro:true});
let tm=0,days=[];try{tm=+localStorage.getItem('cc_time')||0;days=JSON.parse(localStorage.getItem('cc_days')||'[]');}catch(e){}

function streak(){let s=0,d=new Date();while(days.includes(d.toISOString().slice(0,10))){s++;d.setDate(d.getDate()-1);}return s;}
function proHome(){

}

renderHome=function(){return MODE==='pro'?proHome():_rh();};

  addEventListener('keydown',e=>{

/* ===== v6 : comptes, accès gratuit, Pro payant ===== */
const CFG=Object.assign({SUPABASE_URL:"",SUPABASE_ANON_KEY:"",PAYMENT_LINK:"",PRICE_LABEL:"1,99 €"},window.CC_CONFIG||{});
const LIVE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
const FREE_CLASSIC=['m0','m1','m2','m3','m4','m5','m6'],FREE_PRO_MODS=['m0','m1','m2'],FREE_CARDS=6;
const NOACC={email:'',uid:'',token:'',refresh:'',paid:false};
let ACC=Object.assign({},NOACC),pendingMode=null;
try{const a=JSON.parse(localStorage.getItem('cc_acc')||'null');if(a&&a.email)ACC=Object.assign(ACC,a);}catch(e){}
function saveAcc(){try{localStorage.setItem('cc_acc',JSON.stringify(ACC));}catch(e){}}
const flashLimit=()=>ACC.paid?FLASH.length:FREE_CARDS;
const val=id=>(document.getElementById(id)||{}).value||'';
async function api(path,opt){
  opt=opt||{};
  const r=await fetch(CFG.SUPABASE_URL+path,Object.assign({},opt,{headers:Object.assign({apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},opt.headers||{})}));
  const t=await r.text();let j={};try{j=JSON.parse(t);}catch(e){}
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('Erreur '+r.status));
  return j;
}
async function loadPlan(){
  if(!LIVE){let p={};try{p=JSON.parse(localStorage.getItem('cc_demo_paid')||'{}');}catch(e){}ACC.paid=!!p[ACC.email];return;}
  try{const r=await api('/rest/v1/entitlements?select=plan&user_id=eq.'+encodeURIComponent(ACC.uid),{headers:{Authorization:'Bearer '+ACC.token}});ACC.paid=r.length>0&&r[0].plan==='pro';}catch(e){}
}
function lockFor(id){
  if(id==='home'||id==='glossary'||id==='shortcuts')return null;
  const m=MODULES.find(x=>x.id===id);if(!m)return null;
  if(m.pro){if(!ACC.email)return 'account';return(id==='proexam'&&!ACC.paid)?'paid':null;}
  if(FREE_CLASSIC.includes(id))return null;
  return ACC.email?null:'account';
}
function modal(html){
  let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';document.body.appendChild(m);}
  m.innerHTML='<div class="mbox"><button class="mclose" onclick="closeModal()" aria-label="Fermer">×</button><div id="mBody">'+html+'</div></div>';
  m.classList.add('show');
}
function closeModal(){const m=document.getElementById('modal');if(m)m.classList.remove('show');}
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function openAuth(kind,msg){
  const su=kind==='signup';
  modal('<h2>'+(su?'Créer un compte gratuit':'Se connecter')+'</h2>'+(msg?'<p class="mmsg">'+msg+'</p>':'')+(LIVE?'':'<p class="demo">Mode démo : aucun e-mail n\'est envoyé et rien n\'est vérifié. Renseigne config.js pour activer les vrais comptes.</p>')+'<input class="search" id="aEmail" type="email" placeholder="Adresse e-mail" autocomplete="email"><input class="search" id="aPw" type="password" placeholder="Mot de passe (8 caractères minimum)" autocomplete="'+(su?'new-password':'current-password')+'">'+(su?'<label class="cons"><input type="checkbox" id="aCons"> J\'accepte que mon adresse e-mail soit utilisée pour gérer mon compte, conformément à la politique de confidentialité.</label>':'')+'<div class="err" id="aErr"></div><button class="btn" onclick="authSubmit(\''+kind+'\')">'+(su?'Créer mon compte':'Me connecter')+'</button><p class="alt">'+(su?'Déjà inscrit ? <a class="lnk" onclick="openAuth(\'login\')">Se connecter</a>':'Pas encore de compte ? <a class="lnk" onclick="openAuth(\'signup\')">Créer un compte gratuit</a>')+'</p>');
}
function setSession(j){ACC={email:(j.user&&j.user.email)||'',uid:(j.user&&j.user.id)||'',token:j.access_token,refresh:j.refresh_token,paid:false};}
async function authSubmit(kind){
  const em=val('aEmail').trim().toLowerCase(),pw=val('aPw'),err=document.getElementById('aErr');err.textContent='';
  if(!/^\S+@\S+\.\S+$/.test(em)){err.textContent='Adresse e-mail invalide.';return;}
  if(pw.length<8){err.textContent='Mot de passe : 8 caractères minimum.';return;}
  if(kind==='signup'&&!document.getElementById('aCons').checked){err.textContent='Accepte la politique de confidentialité pour créer un compte.';return;}
  try{
    if(LIVE){
      if(kind==='signup'){
        const j=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:em,password:pw})});
        if(!j.access_token){document.getElementById('mBody').innerHTML='<h2>Vérifie ta boîte mail</h2><p>Ton compte est créé. Clique sur le lien de confirmation reçu par e-mail, puis reviens te connecter.</p><button class="btn" onclick="openAuth(\'login\')">Me connecter</button>';return;}
        setSession(j);
      }else{setSession(await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})}));}
    }else{
      let u={};try{u=JSON.parse(localStorage.getItem('cc_demo_users')||'{}');}catch(e){}
      if(kind==='signup'){u[em]=1;localStorage.setItem('cc_demo_users',JSON.stringify(u));}
      else if(!u[em])throw new Error('Compte démo introuvable : crée-le d\'abord.');
      ACC={email:em,uid:'demo',token:'',refresh:'',paid:false};
    }
    await loadPlan();saveAcc();afterAuth();
  }catch(e){err.textContent=e.message||'Erreur inattendue.';}
}
function afterAuth(){closeModal();updateAccBtn();if(pendingMode){const m=pendingMode;pendingMode=null;setMode(m);}else{renderNav();renderMain();}}
function logout(){ACC=Object.assign({},NOACC);saveAcc();closeModal();updateAccBtn();if(MODE==='pro')setMode('classic');else{renderNav();renderMain();}}
function openProfile(){
  modal('<h2>Mon compte</h2><p><b>'+esc(ACC.email)+'</b></p><p>Formule : '+(ACC.paid?'Pro complet':'Gratuite (Classic complet + aperçu Pro)')+'</p>'+(ACC.paid?'':'<button class="btn" onclick="openPay()">Débloquer le Pro complet · '+CFG.PRICE_LABEL+'</button> ')+'<button class="btn ghost" onclick="logout()">Se déconnecter</button>');
}
function openPay(){
  if(!ACC.email){openAuth('signup','Crée d\'abord un compte gratuit, puis débloque le Pro complet.');return;}
  modal('<h2>Débloquer le Pro complet</h2><p class="price">'+CFG.PRICE_LABEL+'<small> · paiement unique</small></p><ul><li>Niveau Pro dans les 13 modules</li><li>Les 24 cartes de révision</li><li>Examen Pro chronométré et attestation</li><li>Carnet de suivi des TP</li></ul><label class="cons"><input type="checkbox" id="pCons"> Je demande l\'accès immédiat à ce contenu numérique et je reconnais perdre mon droit de rétractation une fois l\'accès accordé.</label><div class="err" id="pErr"></div><button class="btn" onclick="payNow()">'+(LIVE?'Payer '+CFG.PRICE_LABEL:'Simuler le paiement (démo)')+'</button>'+(LIVE?'':'<p class="demo">Mode démo : aucun paiement réel. Renseigne PAYMENT_LINK dans config.js.</p>'));
}
function payNow(){
  const er=document.getElementById('pErr');
  if(!document.getElementById('pCons').checked){er.textContent='Coche la case pour continuer.';return;}
  if(LIVE){
    if(!CFG.PAYMENT_LINK){er.textContent='Le paiement n\'est pas encore configuré.';return;}
    location.href=CFG.PAYMENT_LINK+(CFG.PAYMENT_LINK.indexOf('?')>-1?'&':'?')+'client_reference_id='+encodeURIComponent(ACC.uid)+'&prefilled_email='+encodeURIComponent(ACC.email);return;
  }
  let p={};try{p=JSON.parse(localStorage.getItem('cc_demo_paid')||'{}');}catch(e){}
  p[ACC.email]=true;localStorage.setItem('cc_demo_paid',JSON.stringify(p));ACC.paid=true;saveAcc();closeModal();updateAccBtn();renderNav();renderMain();
}
function updateAccBtn(){const b=document.getElementById('accBtn');if(b)b.textContent=ACC.email?(ACC.paid?'Compte · Pro ✓':'Mon compte'):'Se connecter';}
function renderLock(kind){
  document.body.classList.remove('menu-open');

  main.innerHTML='<div class="kicker">'+(ac?'COMPTE GRATUIT REQUIS':'PRO · ACCÈS PAYANT')+'</div><h1 class="page-title">'+m.title+'</h1><p class="lede">'+m.sub+'</p><div class="lockcard"><h2>'+(ac?'Continue la formation gratuitement':'Débloque le Pro complet')+'</h2><p>'+(ac?'Les '+FREE_CLASSIC.length+' premiers modules sont ouverts à tous. Crée un compte gratuit avec ton adresse e-mail pour accéder à la suite de la version Classic (modules, travaux pratiques, fiches techniques, examen final) et à un aperçu de la version Pro.':'Cette partie fait partie du Pro complet : '+CFG.PRICE_LABEL+', paiement unique.')+'</p><button class="btn" onclick="'+(ac?"openAuth('signup')":"openPay()")+'">'+(ac?'Créer mon compte gratuit':'Débloquer pour '+CFG.PRICE_LABEL)+'</button>'+(ac?'<p class="alt">Déjà inscrit ? <a class="lnk" onclick="openAuth(\'login\')">Se connecter</a></p>':'')+'</div>';

function lockBox(t){return '<section class="block"><h2>'+t+' <span class="badge">PRO</span></h2><div class="lockcard"><p>Cette partie fait partie du Pro complet.</p><button class="btn" onclick="openPay()">Débloquer pour '+CFG.PRICE_LABEL+'</button></div></section>';}

const _th=tpHtml;tpHtml=function(){return ACC.paid?_th():lockBox('Carnet de suivi des TP');};

renderMain=function(){

(function(){

async function initAcc(){
  if(!ACC.email)return;
  if(LIVE&&ACC.refresh){
    try{const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:ACC.refresh})});ACC.token=j.access_token;ACC.refresh=j.refresh_token;}
